name: Build Android APK

# Builds an installable .apk automatically in GitHub's cloud - no Flutter or
# Android SDK install needed on your own machine. Triggers on every push to
# main/master that updates mobile_app.zip (the mobile app's source code,
# uploaded as a single zip so it can be added from a phone browser without
# a git client), and can also be triggered manually from the Actions tab
# ("Run workflow").
on:
  push:
    branches: [main, master]
    paths:
      - "mobile_app.zip"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip mobile app source
        run: unzip -o mobile_app.zip -d .

      # Deliberately NOT pinned to an old patch version - Flutter versions
      # before 3.27 have a known bug where plugin subprojects (e.g.
      # speech_to_text, flutter_plugin_android_lifecycle) fail with
      # "compileSdkVersion is not specified" / "Cannot invoke method
      # substring() on null object" because flutter.compileSdkVersion
      # resolves to null for them. See https://github.com/flutter/flutter/issues/164362
      # - fixed in 3.27+. "stable" always resolves to a current release.
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      # `flutter create .` regenerates the android/ and ios/ platform
      # folders around the existing lib/ and pubspec.yaml (harmless to
      # re-run - it will not overwrite your Dart source).
      - name: Ensure platform folders exist
        working-directory: mobile_app
        run: flutter create . --platforms=android

      # Android blocks plain http:// traffic by default since API 28. The
      # android/ folder is regenerated from scratch every run (only
      # res/xml/network_security_config.xml survives, it's checked in - see
      # that file), so the manifest attributes can't just be a one-time
      # manual edit - they have to be re-applied on every build. Belt and
      # suspenders: both the classic usesCleartextTraffic attribute AND the
      # more modern networkSecurityConfig resource. Drop both once the
      # backend is behind https://.
      - name: Allow cleartext HTTP (backend is not on https:// yet)
        working-directory: mobile_app
        run: |
          sed -i 's/<application/<application android:usesCleartextTraffic="true" android:networkSecurityConfig="@xml\/network_security_config"/' android/app/src/main/AndroidManifest.xml
          echo "----- Resulting AndroidManifest.xml -----"
          cat android/app/src/main/AndroidManifest.xml
          echo "-------------------------------------------"

      - working-directory: mobile_app
        run: flutter pub get

      - name: Build release APK
        working-directory: mobile_app
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: social-agent-app-release
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
