name: Build Windows App

# Builds an installable Windows .exe automatically in GitHub's cloud - no
# Visual Studio or Windows machine needed locally. Same mobile_app.zip
# source as the Android build (build-apk.yml) - Flutter is cross-platform,
# so this is the SAME app/code, just compiled for a different target.
# Triggers on every push to main/master that updates mobile_app.zip, and
# can also be triggered manually from the Actions tab ("Run workflow").
on:
  push:
    branches: [main, master]
    paths:
      - "mobile_app.zip"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip mobile app source
        shell: bash
        run: unzip -o mobile_app.zip -d .

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop

      # `flutter create .` regenerates the windows/ platform folder around
      # the existing lib/ and pubspec.yaml (harmless to re-run - it will
      # not overwrite your Dart source), same pattern as
      # `--platforms=android` in build-apk.yml.
      - name: Ensure Windows platform folder exists
        working-directory: mobile_app
        run: flutter create . --platforms=windows

      - working-directory: mobile_app
        run: flutter pub get

      - name: Build release Windows app
        working-directory: mobile_app
        run: flutter build windows --release
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"

      # The build output is a folder (the .exe plus required .dll files and
      # a data/ folder it needs alongside it to run) - upload-artifact zips
      # the whole folder automatically for download.
      - name: Upload Windows app artifact
        uses: actions/upload-artifact@v4
        with:
          name: social-agent-app-windows
          path: mobile_app/build/windows/x64/runner/Release/
