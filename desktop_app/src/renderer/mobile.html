<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090d26">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>نواة سراج</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* تخطيط الجوال: عمود واحد — الموافقات، الخريطة، اللوحات، ثم محادثة المكتب */
    body { display: block; height: auto; min-height: 100vh; }
    main { max-width: 560px; margin: 0 auto; padding: 10px 12px 34px !important; overflow: visible !important; }
    .tab.active { animation: none; }
    #map.active { min-height: 0; }
    #map .map-head h1 { font-size: 22px; }
    #mconn { font-size: 11px; color: #fca5a5; margin-inline-start: 8px; }
    #map .map-grid.neon { flex: none; height: 560px; min-height: 560px; }
    .neon .nring { width: 50px; height: 50px; } .neon .nring span { font-size: 20px; }
    .neon .nring i { transform: rotate(var(--a)) translateY(-36px); }
    .neon .nhead .nring { width: 60px; height: 60px; }
    .neon canvas.ncore { width: 120px; height: 120px; }
    .neon .nlab { white-space: normal; width: 96px; margin-top: 8px; } .neon .nlab b { font-size: 11.5px; }
    .neon .nnode:not(.ndept) .nlab small, .neon .nnode:not(.ndept) .nlab em { display: none; }
    .neon .ndept .nlab { width: 210px; } .neon .ndept .nlab b { font-size: 14px; }
    .neon .nsub .nlab { width: 100px; } .neon .nsub .nlab b { font-size: 11.5px; }
    .neon .ncap small { font-size: 10px; }
    .mside .nside { position: static; display: flex !important; width: auto; margin-top: 12px; }
    #mapSide { display: flex; flex-direction: column; } #mapSide .nchat { order: -1; } /* محادثة القسم مباشرة تحت شجرته */
    .mside .nlog { overflow: visible; }
    .mside .nmsgs { min-height: 70px; max-height: 320px; }
    .mside .nchatf input { font-size: 16px; padding: 9px 10px; } .mside .nchatf button { width: 44px; font-size: 20px; }
    .mside .nhint a { padding: 4px 0; }
    #mAppr h4 { margin: 4px 2px 8px; font-size: 12px; color: #fde047; }
    .mx { --c: #60a5fa; margin-bottom: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--c) 60%, transparent); background: rgba(8,12,34,.8); box-shadow: 0 0 18px color-mix(in srgb, var(--c) 20%, transparent); }
    .mx img { width: 100%; max-height: 300px; object-fit: contain; border-radius: 8px; background: #050818; }
    .mx pre, .mx p { margin: 8px 0; white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; font-size: 13px; line-height: 1.6; color: #dbe5ff; }
    .mx p { max-height: 150px; overflow: auto; }
    .mx .row { display: flex; gap: 8px; align-items: center; }
    .mx button { flex: 1; padding: 10px; border-radius: 8px; font: inherit; font-size: 14px; border: 1px solid #4ade80; background: rgba(74,222,128,.16); color: #eafff1; }
    .mx button.no { border-color: #f87171; background: rgba(248,113,113,.12); color: #ffecec; }
    .mx button:disabled { opacity: .5; }
    .mx small { flex: 2; font-size: 11.5px; color: #9fb2e0; }
    #mtoast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 9; max-width: 88vw; padding: 9px 16px; border-radius: 10px; background: rgba(10,16,44,.96); border: 1px solid rgba(120,160,255,.5); color: #eaf1ff; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
    #mtoast.on { opacity: 1; }
  </style>
</head>
<body>
  <main>
    <section id="map" class="tab active">
      <div class="map-head"><div><small>// القوى العاملة الذكية <span id="mconn"></span></small><h1>نواة سراج<i></i></h1></div></div>
      <div id="mAppr"></div>
      <div id="mapGrid" class="map-grid"></div>
      <div id="mapSide" class="neon mside"></div>
      <div id="mOffice" class="neon mside"></div>
      <p class="map-note">البيانات حيّة من سراج على الكمبيوتر · اضغط أي قسم لعرض وكلائه ومحادثته</p>
    </section>
  </main>
  <div id="mtoast"></div>
  <script>
    window.SIRAJ_MAP_RX = 36; window.SIRAJ_MAP_SUB = 30;
    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    // نفس واجهة window.api في تطبيق الكمبيوتر، لكن عبر خادم سراج
    window.api = { call: async (ch, ...args) => {
      try {
        const r = await fetch('/api', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ch, args }) });
        if (r.status === 401) { location.href = '/pair'; return { ok: false, error: 'غير مصرّح' }; }
        document.getElementById('mconn').textContent = '';
        return await r.json();
      } catch (e) { document.getElementById('mconn').textContent = '● غير متصل بسراج'; return { ok: false, error: 'تعذّر الاتصال بسراج (هل الكمبيوتر يعمل؟)' }; }
    } };
    let tt; function toast(t) { const e = document.getElementById('mtoast'); e.textContent = t; e.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => e.classList.remove('on'), 2800); }
    const S = { state: null };

    // ---------- بطاقات الموافقة: حوالات/فواتير ومنشورات. كل ضغطة تنفيذ تسبقها رسالة تأكيد ----------
    let apprSig = '';
    function renderAppr() {
      const st = S.state, props = st.proposals.filter((p) => p.status === 'pending'), posts = st.posts.filter((p) => p.status === 'pending_review');
      const sig = JSON.stringify([props, posts]); if (sig === apprSig) return; apprSig = sig;
      const el = document.getElementById('mAppr');
      el.innerHTML = (props.length + posts.length ? '<h4>// ينتظر موافقتك</h4>' : '') +
        props.map((p) => `<div class="mx" style="--c:#facc15"><pre>${esc(p.text || 'مقترح محاسبي')}</pre><div class="row">` +
          (p.ready ? `<button data-act="proposal:approve" data-id="${esc(p.id)}" data-confirm="تأكيد أخير: تنفيذ هذه العملية في أودو؟ هذا يغيّر سجلك المحاسبي.">✅ موافقة</button>` : '<small>اختر الفاتورة من تيليجرام أو من المكتب أولاً</small>') +
          `<button class="no" data-act="proposal:reject" data-id="${esc(p.id)}" data-confirm="رفض هذا المقترح؟ لن يُسجَّل شيء.">❌ رفض</button></div></div>`).join('') +
        posts.map((p) => `<div class="mx"><img src="/media/${esc(p.id)}" alt="" loading="lazy"><p>${esc(p.caption)}</p><div class="row">` +
          `<button data-act="post:publish" data-id="${esc(p.id)}" data-confirm="نشر هذا المنشور الآن على صفحاتك العامة؟">✅ انشر الآن</button>` +
          `<button class="no" data-act="post:reject" data-id="${esc(p.id)}" data-confirm="رفض هذا المنشور؟">❌ ارفض</button></div></div>`).join('');
      el.querySelectorAll('button[data-act]').forEach((b) => { b.onclick = async () => {
        if (!confirm(b.dataset.confirm)) return;
        el.querySelectorAll('button').forEach((x) => { x.disabled = true; });
        const r = await api.call(b.dataset.act, b.dataset.id);
        const msg = { 'proposal:approve': () => 'تم التنفيذ' + (r.data && r.data.name ? ': ' + r.data.name : ''), 'proposal:reject': () => 'تم الرفض', 'post:reject': () => 'رُفض المنشور',
          'post:publish': () => (r.data && r.data.status === 'published' ? 'نُشر ✅' : 'فشل النشر، راجع سراج') }[b.dataset.act];
        toast(r.ok ? msg() : 'تعذّر: ' + r.error);
        apprSig = ''; await refresh();
      }; });
    }

    // ---------- محادثة المكتب العامة (نفس عقل تيليجرام) ----------
    const olog = []; let obusy = false, odraft = '';
    function renderOffice() {
      const el = document.getElementById('mOffice');
      const typing = document.activeElement && document.activeElement.closest('#mOffice');
      if (typing && el.firstChild && !renderOffice.force) return; renderOffice.force = false;
      const msgs = olog.map((c) => c.role === 'user' ? `<div class="nm me">${esc(c.text)}</div>` : `<div class="nm"><b>${esc(c.agent || 'المكتب')}</b>${esc(c.text).replace(/\n/g, '<br>')}</div>`).join('') ||
        '<div class="nhint">اكتب أي أمر للمكتب، مثل:<br><a data-oq="ما الذي ينتظر موافقتي؟">ما الذي ينتظر موافقتي؟</a><a data-oq="أعطني ملخص اليوم">ملخص اليوم</a><a data-oq="كم المستحقات المفتوحة؟">كم المستحقات المفتوحة؟</a></div>';
      el.innerHTML = `<div class="nside nchat" style="--c:#7aa2ff"><h4>اسأل المكتب</h4><div class="nmsgs">${msgs}</div><form class="nchatf"><input autocomplete="off" placeholder="اكتب أمرك…" ${obusy ? 'disabled' : ''}><button type="submit" ${obusy ? 'disabled' : ''}>›</button></form></div>`;
      const inp = el.querySelector('input'), box = el.querySelector('.nmsgs');
      inp.value = odraft; inp.oninput = () => { odraft = inp.value; }; box.scrollTop = box.scrollHeight;
      el.querySelector('form').onsubmit = (e) => { e.preventDefault(); officeSend(inp.value); };
      el.querySelectorAll('[data-oq]').forEach((a) => { a.onclick = () => officeSend(a.dataset.oq); });
    }
    async function officeSend(q) {
      q = String(q || '').trim(); if (!q || obusy) return;
      const history = olog.slice(-6).map((c) => ({ role: c.role === 'user' ? 'user' : 'office', text: c.text }));
      olog.push({ role: 'user', text: q }, { role: 'ag', text: 'أفكر…', wait: true });
      obusy = true; odraft = ''; renderOffice.force = true; renderOffice();
      const r = await api.call('assistant:ask', { text: q, history });
      const d = r.data || {}, out = r.ok ? { role: 'ag', agent: d.agent, text: String(d.reply || '') + (d.proposal || (d.proposals && d.proposals.length) ? '\n(بطاقة الموافقة أعلى الصفحة)' : d.doc ? '\n(الملف جاهز في سراج على الكمبيوتر)' : '') } : { role: 'ag', text: '⚠ تعذّر الرد: ' + r.error };
      const i = olog.findIndex((c) => c.wait); if (i >= 0) olog.splice(i, 1, out);
      while (olog.length > 30) olog.shift();
      obusy = false; renderOffice.force = true; renderOffice();
      if (r.ok && (d.proposal || (d.proposals && d.proposals.length))) refresh();
    }

    async function refresh() { const r = await api.call('state'); if (!r.ok) return; S.state = r.data; SirajMap.update(S.state); renderAppr(); }
    async function slow() { // بيانات أبطأ (عقود، أودو، زيارات) تُجلب بالتتابع
      if (!S.state) return;
      const ct = await api.call('contracts:list'); if (ct.ok) SirajMap.update(S.state, ct.data);
      if (S.state.odoo.hasKey) { const o = await api.call('odoo:summary'); SirajMap.update(S.state, undefined, o.ok ? o.data : { error: o.error }); }
      if (S.state.visits.hasToken) { const v = await api.call('visits:summary'); SirajMap.update(S.state, undefined, undefined, v.ok ? v.data : { error: v.error }); }
    }
  </script>
  <script src="map.js"></script>
  <script>
    renderOffice();
    refresh().then(slow);
    try { new EventSource('/events').onmessage = () => refresh(); } catch (e) { setInterval(refresh, 15000); }
    setInterval(slow, 120000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
  </script>
</body>
</html>
